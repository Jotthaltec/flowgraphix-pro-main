name: Deploy HostGator

# Todo push na main constrói o app e envia por FTPS explícito (porta 21) para a
# hospedagem. Lá o "Configurar Aplicativo Node.js" (Passenger) roda o SSR via
# app.cjs. Ver deploy/hostgator/README.md para a configuração inicial no cPanel.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois deploys simultâneos no mesmo FTP corrompem o estado de sync do servidor.
concurrency:
  group: hostgator-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # npm, e não bun: o bun.lock está parado desde 01/06 enquanto o
      # package-lock.json acompanha o package.json — e é ele que o cPanel usa
      # para instalar no servidor, então CI e produção resolvem igual.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        # As VITE_* são inlineadas no bundle do cliente em tempo de build — sem
        # elas o app sobe sem conseguir falar com o Supabase.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_LOJA_URL: ${{ secrets.VITE_LOJA_URL }}
        run: npm run build

      - name: Montar pacote de deploy
        run: |
          set -euo pipefail
          rm -rf deploy-out
          mkdir -p deploy-out/tmp
          cp -r dist deploy-out/dist
          cp package.json package-lock.json deploy-out/
          cp deploy/hostgator/app.cjs deploy-out/app.cjs
          cp deploy/hostgator/.npmrc deploy-out/.npmrc
          # Passenger reinicia quando o mtime de tmp/restart.txt muda; subir o
          # arquivo a cada deploy é o que faz o código novo entrar no ar.
          date -u +"%Y-%m-%dT%H:%M:%SZ commit ${GITHUB_SHA}" > deploy-out/tmp/restart.txt

      - name: Enviar por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-out/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
          # node_modules vive só no servidor (instalado pelo cPanel) e nunca
          # deve ser tocado pelo sync.
          exclude: |
            **/node_modules/**
            **/.git*
            **/.git*/**
